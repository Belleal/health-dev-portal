# The questions, moved unchanged from his.bg (plan 8c, decision 5), by category in the order the FAQ shows them, each
# category's questions in his.bg's order. Each has faq/{slug}.bg.md and, once translated, {slug}.en.md.
faq:
  source: "https://www.his.bg/bg/dev/faq"
  retrieved: "2026-11-17"
  categories:
    - key: authentication
      name: { bg: "Автентикация и подпис", en: "Authentication and signing" }
      questions: [ token-method, signature-schema, signature-format ]
    - key: messages
      name: { bg: "Съобщения", en: "Messages" }
      questions: [ repeated-elements, lrn, patient-names ]
    - key: e-referral
      name: { bg: "Е-направление", en: "e-Referral" }
      questions: [ lab-staff, nhif-number, cdr07-country, pmi-deputy ]
    - key: nomenclatures
      name: { bg: "Номенклатури", en: "Nomenclatures" }
      questions: [ qualification-gp ]
