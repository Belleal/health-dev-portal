<!-- The studio's sign-in brand: its name, and no link to the public site. The static-path search resolves this file in
     preference to the framework's (web-framework 1.63.1, fragments/components/component-login-brand.html). Both texts
     are the same in the two languages, so the element's own text is the whole of it; a name that translates would
     carry `x-text-label`, as the studio's other texts do. -->
<div class="ti-login-brand">
    <div class="ti-login-brand-mark" data-ti-keep>Н</div>
    <div class="ti-login-brand-text">
        <div class="ti-login-brand-title" data-ti-keep>НЗИС · студио</div>
        <div class="ti-login-brand-sub" data-ti-keep>Health dev portal studio</div>
    </div>
</div>
